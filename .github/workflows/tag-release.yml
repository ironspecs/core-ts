name: Tag Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pack and upload packages
        run: |
          mkdir -p "$RUNNER_TEMP/pack-out"
          for pkg in react react-i18n react-progression react-form-builder; do
            (cd "$pkg" && bun pm pack --destination "$RUNNER_TEMP/pack-out")
            # core-ts-<pkg>-<version>.tgz; the [0-9] anchor disambiguates
            # "react" from "react-i18n"/"react-form-builder"/"react-progression".
            tgz=$(ls "$RUNNER_TEMP/pack-out/core-ts-$pkg"-[0-9]*.tgz | head -1)
            gh release upload "${{ github.ref_name }}" "$tgz"
          done
        env:
          GH_TOKEN: ${{ github.token }}
