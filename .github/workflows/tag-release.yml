name: Tag Release

on:
  push:
    tags: ['v[0-9]*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pack and upload packages
        run: |
          for pkg in react react-i18n react-progression react-form-builder; do
            cd "$pkg"
            # npm pack creates a tarball of files that would be published
            bun pm pack
            TARBALL=$(ls core-ts-*.tgz | head -1)
            gh release upload "${{ github.ref_name }}" "$pkg/$TARBALL"
            cd ..
          done
        env:
          GH_TOKEN: ${{ github.token }}
