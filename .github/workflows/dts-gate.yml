name: DTS Gate

on:
  pull_request:
    branches: [main]

jobs:
  dts-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find ancestor tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          if [[ -z "$TAG" ]]; then
            echo "No ancestor tag found — nothing to compare against."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ancestor tag: $TAG"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release packages
        if: steps.tag.outputs.found == 'true'
        run: |
          mkdir -p baseline
          if ! gh release download "${{ steps.tag.outputs.tag }}" --dir baseline; then
            echo "::error::No GitHub release found for tag ${{ steps.tag.outputs.tag }}."
            echo "Push a v* tag so the Tag Release workflow creates the release first."
            exit 1
          fi
          # Tarballs use the npm pack layout (top-level package/ dir). Extract
          # each into its own per-package dir so the action finds <pkg>/dist.
          for pkg in react react-i18n react-progression react-form-builder; do
            tgz=$(ls "baseline/core-ts-$pkg"-[0-9]*.tgz | head -1)
            mkdir -p "baseline/$pkg"
            tar -xzf "$tgz" -C "baseline/$pkg" --strip-components=1
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Bun
        if: steps.tag.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        if: steps.tag.outputs.found == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.tag.outputs.found == 'true'
        run: bun run build

      - name: Assert DTS match
        if: steps.tag.outputs.found == 'true'
        uses: softwarepatterns/github-actions/assert-dts-match@v1
        with:
          baseline: baseline
          candidate: .
          packages: react react-i18n react-progression react-form-builder
